name: typscord

services:
  app:
    build: .
    depends_on:
      - otel
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel:4318}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN must be set}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:?DISCORD_PUBLIC_KEY must be set}
    ports:
      - host_ip: 127.0.0.1
        published: 3000
        target: 3000
        protocol: tcp
    networks:
      - telemetry

  otel:
    image: ghcr.io/metafab/otel-gui:v2.0.0
    ports:
      - host_ip: 127.0.0.1
        published: 4318
        target: 4318
        protocol: tcp
    networks:
      - telemetry

networks:
  telemetry:
